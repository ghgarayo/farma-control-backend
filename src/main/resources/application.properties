# ==============================================================================
# 1. IMPORTAÇÃO DO ARQUIVO DE AMBIENTE (.env.dev)
# ==============================================================================
# O prefixo ../ indica que o Spring deve buscar o arquivo na pasta raiz do projeto pai
spring.config.import=optional:file:../.env.dev[.properties]

# ==============================================================================
# 2. CONFIGURAÇÃO DO BANCO DE DATOS (PostgreSQL)
# ==============================================================================
# placeholders ${VAR:default} garantem que a aplicação não quebre se a variável faltar
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:farma-control}
spring.datasource.username=${POSTGRES_USER:root}
spring.datasource.password=${POSTGRES_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração de Pool para Desenvolvimento
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ==============================================================================
# 3. FLYWAY (Migrações do Banco de Dados)
# ==============================================================================
spring.flyway.enabled=true
# Garante que o Flyway use a pasta correta (src/main/resources/db/migration)
spring.flyway.locations=classpath:db/migration
# Permite que o Flyway inicie mesmo se o banco já tiver tabelas manuais
spring.flyway.baseline-on-migrate=true
# Ajuda a identificar erros de sintaxe nos seus arquivos .sql
spring.flyway.validate-on-migrate=true

# ==============================================================================
# 4. JPA / HIBERNATE
# ==============================================================================
# 'none' no primeiro boot evita o erro de "missing table" antes do Flyway rodar.
# Mude para 'validate' após as tabelas serem criadas com sucesso.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================================================================
# 5. SEGURANÇA E JWT
# ==============================================================================
# Mapeia a chave secreta vinda do seu .env.dev
api.security.token.secret=${JWT_SECRET:GHXS3CR3T}

# ==============================================================================
# 6. INTEGRAÇÃO DOCKER COMPOSE
# ==============================================================================
# Desativado para evitar que o Spring tente gerenciar o container que você já subiu via terminal
spring.docker.compose.enabled=false

# ==============================================================================
# 7. LOGS (Auxilia no Debug de Inicialização)
# ==============================================================================
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG