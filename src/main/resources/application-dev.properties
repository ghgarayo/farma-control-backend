

# ===============================
# 2. Banco de Dados
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:farma-control}
spring.datasource.username=${POSTGRES_USER:root}
spring.datasource.password=${POSTGRES_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de Conexões (Hikari)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ===============================
# 3. Flyway - Configurações Explícitas
# ===============================
spring.flyway.enabled=true
spring.flyway.user=${POSTGRES_USER:root}
spring.flyway.password=${POSTGRES_PASSWORD:root}
spring.flyway.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:farma-control}

# Garante que o Flyway procure na pasta correta
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Se o Flyway falhar, a aplicação deve parar para você saber o erro (ajuda no debug)
spring.flyway.fail-on-missing-locations=true

# ===============================
# 4. JPA / Hibernate
# ===============================
# Mantemos 'none' até as tabelas aparecerem, depois mude para 'validate'
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# 5. Segurança & JWT
# ===============================
api.security.token.secret=${JWT_SECRET:GHXS3CR3T}

# ===============================
# 6. Debug e Logs
# ===============================
spring.docker.compose.enabled=false
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG